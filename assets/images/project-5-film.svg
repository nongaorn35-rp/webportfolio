<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="filmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background Forest/Film Scenery Canvas -->
  <rect width="800" height="450" fill="url(#filmSky)"/>

  <!-- Cinematic Letterbox Bars (Top & Bottom Cinema Scope) -->
  <rect x="0" y="0" width="800" height="40" fill="#000000"/>
  <rect x="0" y="410" width="800" height="40" fill="#000000"/>

  <!-- Cinematic Golden Hour Sun -->
  <circle cx="500" cy="180" r="90" fill="url(#warmSun)" opacity="0.85"/>
  <circle cx="500" cy="180" r="140" fill="#facc15" opacity="0.15" filter="blur(15px)"/>

  <!-- Mist and Mountains Silhouette -->
  <!-- Back Ridge -->
  <path d="M 0 350 L 150 240 L 320 310 L 480 200 L 640 280 L 800 190 L 800 410 L 0 410 Z" fill="#064e3b" opacity="0.6"/>
  <!-- Middle Ridge -->
  <path d="M 0 380 L 180 270 L 360 340 L 520 250 L 690 320 L 800 260 L 800 410 L 0 410 Z" fill="#022c22" opacity="0.85"/>
  <!-- Front Pine Trees Silhouettes -->
  <polygon points="80,410 110,310 140,410" fill="#021a14"/>
  <polygon points="120,410 145,330 170,410" fill="#021a14"/>
  <polygon points="260,410 290,320 320,410" fill="#021a14"/>
  <polygon points="620,410 655,290 690,410" fill="#021a14"/>
  <polygon points="680,410 705,330 730,410" fill="#021a14"/>

  <!-- DaVinci Color Grading Vectorscope / Parade Graphic Overlay -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="180" height="110" rx="10" fill="rgba(11, 15, 25, 0.85)" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">RGB PARADE SCOPE</text>
    
    <!-- Red Channel Wave -->
    <path d="M 15 85 Q 30 50 45 70 Q 55 90 65 60" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Green Channel Wave -->
    <path d="M 75 80 Q 90 40 105 65 Q 115 85 125 55" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Blue Channel Wave -->
    <path d="M 135 75 Q 145 35 155 60 Q 165 80 170 50" fill="none" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Grid lines -->
    <line x1="12" y1="45" x2="168" y2="45" stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="12" y1="75" x2="168" y2="75" stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3"/>
  </g>

  <!-- Film Timecode Overlay -->
  <rect x="330" y="360" width="140" height="28" rx="6" fill="rgba(0, 0, 0, 0.7)" stroke="#facc15" stroke-width="1"/>
  <text x="400" y="379" fill="#facc15" font-family="'Plus Jakarta Sans', monospace" font-size="12" font-weight="700" text-anchor="middle">REC 00:04:28:14</text>

  <!-- Tag Overlay -->
  <rect x="40" y="55" width="200" height="34" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#10b981" stroke-width="1"/>
  <text x="55" y="77" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">SHORT FILM & COLORING</text>

  <rect x="40" y="100" width="280" height="42" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#facc15" stroke-width="1"/>
  <text x="55" y="127" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">ECHOES OF NATURE</text>
</svg>
