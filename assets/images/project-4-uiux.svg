<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="shadow3D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#uiBgGrad)"/>

  <!-- Perspective Web Browser Mockup Frame -->
  <g transform="translate(140, 80)" filter="url(#shadow3D)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="580" height="330" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="580" height="42" rx="16" fill="#1e293b"/>
    <rect x="0" y="26" width="580" height="16" fill="#1e293b"/>
    <line x1="0" y1="42" x2="580" y2="42" stroke="#334155" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="90" y="10" width="340" height="22" rx="6" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
    <text x="110" y="25" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500">https://metaverse-gallery.art/virtual-tour</text>

    <!-- Browser Content: 3D Art Gallery UI -->
    <!-- Nav inside UI -->
    <text x="25" y="70" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">METASPACE</text>
    <rect x="440" y="58" width="110" height="26" rx="13" fill="#0ea5e9"/>
    <text x="495" y="74" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">CONNECT 3D</text>

    <!-- 3D Virtual Artwork Display Cards inside Web Layout -->
    <!-- Center Piece -->
    <rect x="180" y="95" width="220" height="170" rx="12" fill="url(#artGrad)" stroke="#facc15" stroke-width="2"/>
    <circle cx="290" cy="170" r="40" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="290,135 320,185 260,185" fill="#ffffff" opacity="0.8"/>
    
    <!-- Hotspot Beacon on artwork -->
    <circle cx="340" cy="130" r="10" fill="#facc15" opacity="0.3"/>
    <circle cx="340" cy="130" r="5" fill="#facc15"/>

    <!-- Left Gallery Piece Preview -->
    <rect x="25" y="115" width="135" height="135" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7"/>
    <circle cx="92" cy="175" r="28" fill="#0ea5e9" opacity="0.3"/>

    <!-- Right Gallery Piece Preview -->
    <rect x="420" y="115" width="135" height="135" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <rect x="445" y="145" width="85" height="60" rx="6" fill="#38bdf8" opacity="0.2"/>

    <!-- Bottom UI Controller Floating Bar -->
    <rect x="190" y="275" width="200" height="34" rx="17" fill="rgba(11, 15, 25, 0.9)" stroke="#475569" stroke-width="1"/>
    <!-- Controls Icons -->
    <circle cx="225" cy="292" r="10" fill="#1e293b"/>
    <polygon points="222,287 230,292 222,297" fill="#0ea5e9"/>
    <circle cx="260" cy="292" r="10" fill="#1e293b"/>
    <circle cx="295" cy="292" r="10" fill="#1e293b"/>
    <circle cx="330" cy="292" r="10" fill="#1e293b"/>
    <circle cx="365" cy="292" r="10" fill="#facc15"/>

    <!-- Modern Cursor Pointer -->
    <g transform="translate(355, 145)">
      <polygon points="0,0 0,18 5,14 9,22 13,20 9,12 16,12" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Tag Overlay -->
  <rect x="40" y="40" width="170" height="34" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="62" fill="#0ea5e9" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">UI/UX & WEB DESIGN</text>

  <rect x="40" y="85" width="290" height="42" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#facc15" stroke-width="1"/>
  <text x="55" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">METAVERSE ART GALLERY</text>
</svg>
