<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Circles -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.2"/>

  <!-- Glowing Aura -->
  <circle cx="250" cy="220" r="120" fill="#0ea5e9" opacity="0.2" filter="url(#glow)"/>
  <circle cx="280" cy="260" r="90" fill="#facc15" opacity="0.15" filter="url(#glow)"/>

  <!-- Character Silhouette / Body Base -->
  <!-- Shoulders & Torso with Modern Jacket -->
  <path d="M 120 460 C 130 380, 180 340, 250 340 C 320 340, 370 380, 380 460 Z" fill="#1e293b"/>
  <!-- Jacket Collar Lines in Neon Cyan & Yellow -->
  <path d="M 190 350 L 250 420 L 230 460" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 310 350 L 250 420 L 270 460" stroke="#facc15" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Neck -->
  <rect x="225" y="270" width="50" height="70" rx="8" fill="#e2e8f0" opacity="0.9"/>

  <!-- Head / Face Outline -->
  <ellipse cx="250" cy="220" rx="65" ry="75" fill="#f1f5f9"/>

  <!-- Hair / Creative Hairstyle -->
  <path d="M 180 210 C 175 140, 220 120, 280 120 C 330 120, 335 160, 325 210 C 320 180, 300 160, 260 160 C 210 160, 195 190, 180 210 Z" fill="#0f172a"/>
  <!-- Cyan Hair Streak Highlight -->
  <path d="M 230 130 C 270 135, 295 155, 305 180" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Stylish Creative Designer Glasses -->
  <rect x="200" y="200" width="42" height="32" rx="10" fill="none" stroke="#0ea5e9" stroke-width="4"/>
  <rect x="258" y="200" width="42" height="32" rx="10" fill="none" stroke="#facc15" stroke-width="4"/>
  <line x1="242" y1="216" x2="258" y2="216" stroke="#facc15" stroke-width="4"/>
  <!-- Glasses Lens Reflection -->
  <path d="M 205 224 L 225 206" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 263 224 L 283 206" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Friendly Smile & Nose -->
  <path d="M 248 230 L 252 245 L 246 248" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 235 260 Q 250 272 265 260" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Creative Media Headphones -->
  <path d="M 175 220 C 175 130, 325 130, 325 220" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <rect x="168" y="195" width="22" height="50" rx="11" fill="url(#primaryGrad)"/>
  <rect x="310" y="195" width="22" height="50" rx="11" fill="url(#accentGrad)"/>

  <!-- Floating Creative Graphic Elements -->
  <!-- Pen Tool Anchor -->
  <g transform="translate(80, 140)">
    <circle cx="15" cy="15" r="18" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M 10 20 L 20 10 M 15 8 L 22 15" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Video Play Symbol -->
  <g transform="translate(370, 130)">
    <circle cx="15" cy="15" r="18" fill="rgba(250, 204, 21, 0.2)" stroke="#facc15" stroke-width="2"/>
    <polygon points="12,9 22,15 12,21" fill="#facc15"/>
  </g>

  <!-- Camera Aperture / Shutter Icon -->
  <g transform="translate(85, 330)">
    <circle cx="15" cy="15" r="18" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="15" cy="15" r="7" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M 390 300 Q 400 300 400 290 Q 400 300 410 300 Q 400 300 400 310 Q 400 300 390 300 Z" fill="#facc15"/>
  <path d="M 120 250 Q 128 250 128 242 Q 128 250 136 250 Q 128 250 128 258 Q 128 250 120 250 Z" fill="#38bdf8"/>
</svg>
