<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="aiCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#aiBg)"/>

  <!-- Neural Network Connections Wave Canvas -->
  <g opacity="0.6">
    <!-- Sine waves representing Generative Diffusion Latent Space -->
    <path d="M 0 200 Q 200 80, 400 225 T 800 250" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 0 220 Q 200 320, 400 225 T 800 200" fill="none" stroke="#facc15" stroke-width="1.5" opacity="0.7"/>
    <path d="M 0 160 Q 200 260, 400 200 T 800 180" fill="none" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Central Generative Core / Neural Matrix -->
  <g transform="translate(480, 225)" filter="url(#aiGlow)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="12 8"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#facc15" stroke-width="2"/>
    <circle cx="0" cy="0" r="45" fill="url(#aiCoreGrad)" opacity="0.7"/>
    
    <!-- Central AI Neural Nodes -->
    <circle cx="-50" cy="-40" r="8" fill="#38bdf8"/>
    <line x1="-50" y1="-40" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>

    <circle cx="50" cy="-30" r="8" fill="#facc15"/>
    <line x1="50" y1="-30" x2="0" y2="0" stroke="#facc15" stroke-width="2"/>

    <circle cx="-35" cy="50" r="7" fill="#facc15"/>
    <line x1="-35" y1="50" x2="0" y2="0" stroke="#facc15" stroke-width="2"/>

    <circle cx="45" cy="45" r="9" fill="#38bdf8"/>
    <line x1="45" y1="45" x2="0" y2="0" stroke="#38bdf8" stroke-width="2"/>

    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>

  <!-- Prompt Interface Mockup Box on Left -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="280" height="190" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Header of Prompt Box -->
    <rect x="0" y="0" width="280" height="36" rx="14" fill="#1e293b"/>
    <rect x="0" y="20" width="280" height="16" fill="#1e293b"/>
    <circle cx="16" cy="18" r="4" fill="#ef4444"/>
    <circle cx="28" cy="18" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="18" r="4" fill="#10b981"/>
    <text x="58" y="22" fill="#94a3b8" font-family="'Plus Jakarta Sans', monospace" font-size="10">ai-diffusion-prompt.sh</text>

    <!-- Prompt text lines -->
    <text x="16" y="60" fill="#38bdf8" font-family="'Plus Jakarta Sans', monospace" font-size="11">> prompt:</text>
    <text x="16" y="80" fill="#f1f5f9" font-family="'Plus Jakarta Sans', monospace" font-size="10">"Futuristic neon sculpture,</text>
    <text x="16" y="98" fill="#f1f5f9" font-family="'Plus Jakarta Sans', monospace" font-size="10">bioluminescent fluid, 8k"</text>
    
    <text x="16" y="125" fill="#facc15" font-family="'Plus Jakarta Sans', monospace" font-size="11">> cfg_scale: 7.5 | steps: 35</text>
    <text x="16" y="145" fill="#34d399" font-family="'Plus Jakarta Sans', monospace" font-size="11">> sampling: DPM++ 2M Karras</text>
    
    <rect x="16" y="158" width="100" height="18" rx="4" fill="#0ea5e9"/>
    <text x="66" y="171" fill="#0b0f19" font-family="'Plus Jakarta Sans', monospace" font-size="9" font-weight="700" text-anchor="middle">SYNTHESIZED</text>
  </g>

  <!-- Tag Overlay -->
  <rect x="40" y="40" width="180" height="34" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#facc15" stroke-width="1"/>
  <text x="55" y="62" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">AI & GENERATIVE MEDIA</text>

  <rect x="40" y="85" width="280" height="42" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">SYNTHESIS AI LAB</text>
</svg>
