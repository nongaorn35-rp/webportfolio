<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="actBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="50%" stop-color="#150e2e"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="glowPurple1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#actBg1)"/>
  <circle cx="400" cy="225" r="160" fill="none" stroke="url(#glowPurple1)" stroke-width="2" opacity="0.4" stroke-dasharray="8 6"/>
  <circle cx="400" cy="225" r="110" fill="rgba(168, 85, 247, 0.1)"/>
  
  <!-- Workshop Monitor & Tools -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="280" height="170" rx="14" fill="#0d0b1a" stroke="#a855f7" stroke-width="2"/>
    <rect x="12" y="12" width="256" height="146" rx="8" fill="#140f28"/>
    <!-- Keyframes / Timeline in UI -->
    <path d="M 30 110 L 80 50 L 130 90 L 180 40 L 230 100" fill="none" stroke="#0ea5e9" stroke-width="3"/>
    <circle cx="80" cy="50" r="5" fill="#c084fc"/>
    <circle cx="130" cy="90" r="5" fill="#38bdf8"/>
    <circle cx="180" cy="40" r="5" fill="#a855f7"/>
    <!-- Stand -->
    <rect x="120" y="170" width="40" height="35" fill="#0d0b1a" stroke="#231a44" stroke-width="1.5"/>
    <rect x="80" y="205" width="120" height="12" rx="6" fill="#1e1838" stroke="#a855f7" stroke-width="1.5"/>
  </g>

  <!-- Floating Badges -->
  <rect x="40" y="40" width="210" height="36" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="64" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">WORKSHOP & TRAINING</text>
  <rect x="40" y="88" width="310" height="42" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#a855f7" stroke-width="1"/>
  <text x="55" y="115" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">ADVANCED MOTION & VFX</text>
</svg>
