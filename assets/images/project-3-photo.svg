<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="photoSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="stageLight1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.8)"/>
      <stop offset="60%" stop-color="rgba(14, 165, 233, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="stageLight2" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(250, 204, 21, 0.85)"/>
      <stop offset="50%" stop-color="rgba(245, 158, 11, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="laserCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Dark Festival Sky -->
  <rect width="800" height="450" fill="url(#photoSky)"/>

  <!-- Stage Lights Spotlights -->
  <rect width="800" height="450" fill="url(#stageLight1)"/>
  <rect width="800" height="450" fill="url(#stageLight2)"/>

  <!-- Cones of Stage Lights -->
  <polygon points="120,450 350,80 400,80 280,450" fill="url(#laserCyan)" opacity="0.35"/>
  <polygon points="680,450 420,70 470,70 540,450" fill="rgba(250, 204, 21, 0.3)" opacity="0.4"/>
  <polygon points="50,450 300,100 330,100 120,450" fill="rgba(56, 189, 248, 0.2)"/>
  <polygon points="750,450 490,90 520,90 650,450" fill="rgba(245, 158, 11, 0.25)"/>

  <!-- Festival Stage Trusses and Rigging -->
  <line x1="200" y1="80" x2="600" y2="80" stroke="#475569" stroke-width="4"/>
  <line x1="220" y1="110" x2="580" y2="110" stroke="#334155" stroke-width="2"/>
  <!-- Stage Scaffold Pattern -->
  <path d="M 220 80 L 250 110 L 280 80 L 310 110 L 340 80 L 370 110 L 400 80 L 430 110 L 460 80 L 490 110 L 520 80 L 550 110 L 580 80" stroke="#64748b" stroke-width="1.5" fill="none"/>

  <!-- Bokeh Particles -->
  <circle cx="280" cy="180" r="32" fill="rgba(14, 165, 233, 0.25)" filter="blur(4px)"/>
  <circle cx="340" cy="220" r="18" fill="rgba(250, 204, 21, 0.3)" filter="blur(3px)"/>
  <circle cx="480" cy="160" r="26" fill="rgba(250, 204, 21, 0.35)" filter="blur(4px)"/>
  <circle cx="530" cy="240" r="40" fill="rgba(56, 189, 248, 0.2)" filter="blur(5px)"/>
  <circle cx="420" cy="130" r="14" fill="#ffffff" opacity="0.6" filter="blur(2px)"/>

  <!-- Crowd Silhouette Hands with Phones & Cheering -->
  <path d="M 0 450 
           L 0 380 
           Q 40 370 70 385 
           Q 110 360 140 390 
           Q 180 350 220 375 
           Q 260 340 300 370 
           Q 340 320 380 365 
           Q 420 310 460 360 
           Q 500 330 540 370 
           Q 580 345 620 380 
           Q 670 350 710 375 
           Q 760 360 800 380 
           L 800 450 Z" fill="#030712"/>

  <!-- Phone Screens Glow in the Crowd -->
  <rect x="290" y="325" width="14" height="22" rx="3" fill="#ffffff" transform="rotate(-15, 290, 325)" filter="blur(1px)"/>
  <rect x="445" y="300" width="16" height="24" rx="3" fill="#38bdf8" transform="rotate(8, 445, 300)" filter="blur(1px)"/>
  <rect x="605" y="335" width="14" height="22" rx="3" fill="#facc15" transform="rotate(-10, 605, 335)" filter="blur(1px)"/>

  <!-- Camera Viewfinder Overlay Graphic Elements -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.5" fill="none">
    <!-- Top-Left Corner -->
    <path d="M 120 120 L 80 120 L 80 160"/>
    <!-- Top-Right Corner -->
    <path d="M 680 120 L 720 120 L 720 160"/>
    <!-- Bottom-Left Corner -->
    <path d="M 120 330 L 80 330 L 80 290"/>
    <!-- Bottom-Right Corner -->
    <path d="M 680 330 L 720 330 L 720 290"/>
    <!-- Center Focus Box -->
    <rect x="385" y="195" width="30" height="30" rx="4" stroke="#facc15" stroke-width="2"/>
    <circle cx="400" cy="210" r="3" fill="#facc15"/>
  </g>

  <!-- Tag Overlay -->
  <rect x="40" y="40" width="180" height="34" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#38bdf8" stroke-width="1"/>
  <text x="55" y="62" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">EVENT PHOTOGRAPHY</text>

  <rect x="40" y="85" width="280" height="42" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#facc15" stroke-width="1"/>
  <text x="55" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">AURORA FESTIVAL 2026</text>
</svg>
