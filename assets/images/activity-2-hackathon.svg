<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="actBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="50%" stop-color="#120d29"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#actBg2)"/>
  
  <!-- Trophy & Design Screens for Hackathon -->
  <g transform="translate(350, 100)">
    <!-- Trophy Cup -->
    <path d="M 30 30 L 70 30 L 60 90 Q 50 110 50 120 L 50 140 L 25 140 L 25 150 L 75 150 L 75 140 L 50 140" fill="none" stroke="url(#neonCyanPurple)" stroke-width="4"/>
    <path d="M 30 40 C 10 40 10 70 35 75" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 70 40 C 90 40 90 70 65 75" fill="none" stroke="#a855f7" stroke-width="3"/>
    <circle cx="50" cy="65" r="14" fill="#c084fc" opacity="0.3"/>
    <polygon points="50,55 53,62 60,63 55,68 56,75 50,71 44,75 45,68 40,63 47,62" fill="#c084fc"/>
  </g>

  <!-- Wireframe Cards Background -->
  <g transform="translate(180, 160)" opacity="0.8">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="#0d0b1a" stroke="#0ea5e9" stroke-width="1.5"/>
    <line x1="20" y1="30" x2="80" y2="30" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="20" y="45" width="120" height="45" rx="6" fill="#140f28"/>
  </g>
  <g transform="translate(460, 160)" opacity="0.8">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="#0d0b1a" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="40" cy="55" r="20" fill="none" stroke="#c084fc" stroke-width="2"/>
    <line x1="75" y1="45" x2="135" y2="45" stroke="#c084fc" stroke-width="2"/>
    <line x1="75" y1="65" x2="115" y2="65" stroke="#7e22ce" stroke-width="2"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="220" height="36" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#a855f7" stroke-width="1"/>
  <text x="55" y="64" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">COMPETITION & AWARDS</text>
  <rect x="40" y="88" width="320" height="42" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="115" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">UI/UX CREATIVE HACKATHON</text>
</svg>
