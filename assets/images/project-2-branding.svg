<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Geometric Brand Graphic Grid Elements -->
  <circle cx="650" cy="225" r="160" fill="none" stroke="rgba(250, 204, 21, 0.15)" stroke-width="1.5"/>
  <circle cx="650" cy="225" r="220" fill="none" stroke="rgba(14, 165, 233, 0.12)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Abstract Shadow Base -->
  <ellipse cx="400" cy="380" rx="260" ry="25" fill="#000000" opacity="0.4" filter="blur(8px)"/>

  <!-- Coffee Bag Packaging Silhouette -->
  <g transform="translate(240, 100)">
    <!-- Main Bag Body -->
    <path d="M 30 50 L 170 50 L 190 280 L 10 280 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Folded Top -->
    <polygon points="30,50 170,50 160,20 40,20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="35" y="16" width="130" height="8" rx="3" fill="url(#goldGrad)"/>
    
    <!-- Bag Label -->
    <rect x="45" y="90" width="110" height="130" rx="8" fill="#090d16" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Label Sun Logo -->
    <circle cx="100" cy="130" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 100 118 L 100 122 M 100 138 L 100 142 M 88 130 L 92 130 M 108 130 L 112 130" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="100" y="165" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="2">LUMINA</text>
    <text x="100" y="180" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="1">SPECIALTY COFFEE</text>
    <text x="100" y="200" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" text-anchor="middle">ETHIOPIA YIRGACHEFFE</text>
  </g>

  <!-- Premium Takeaway Cup -->
  <g transform="translate(460, 160)">
    <!-- Cup Body -->
    <polygon points="20,50 120,50 105,220 35,220" fill="url(#cupGrad)"/>
    <!-- Cup Lid -->
    <path d="M 10 50 L 130 50 L 125 35 L 15 35 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="25" y="26" width="90" height="9" rx="3" fill="#0f172a"/>
    <!-- Cup Sleeve -->
    <polygon points="23,90 117,90 112,160 28,160" fill="#090d16" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Sleeve Emblem -->
    <circle cx="70" cy="125" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="70" y="129" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">L</text>
  </g>

  <!-- Floating Roasted Coffee Beans with Glow -->
  <g transform="translate(190, 310)">
    <ellipse cx="15" cy="15" rx="14" ry="9" fill="#78350f" transform="rotate(-30, 15, 15)"/>
    <path d="M 5 15 Q 15 12 25 15" stroke="#facc15" stroke-width="1.5" transform="rotate(-30, 15, 15)"/>
  </g>
  <g transform="translate(610, 320)">
    <ellipse cx="15" cy="15" rx="14" ry="9" fill="#78350f" transform="rotate(25, 15, 15)"/>
    <path d="M 5 15 Q 15 18 25 15" stroke="#facc15" stroke-width="1.5" transform="rotate(25, 15, 15)"/>
  </g>

  <!-- Tag Overlay -->
  <rect x="40" y="40" width="190" height="34" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#facc15" stroke-width="1"/>
  <text x="55" y="62" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">BRANDING & PACKAGING</text>
  
  <rect x="40" y="85" width="280" height="42" rx="8" fill="rgba(11, 15, 25, 0.85)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="112" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.5">LUMINA COFFEE ROASTERS</text>
</svg>
