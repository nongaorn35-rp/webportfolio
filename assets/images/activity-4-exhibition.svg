  <rect x="40" y="88" width="310" height="42" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="115" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">CREATIVE MEDIA GRAD SHOW</text>
</svg>
