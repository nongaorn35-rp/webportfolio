<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="actBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="50%" stop-color="#180e30"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#actBg4)"/>
  
  <!-- Exhibition Gallery Frames -->
  <g transform="translate(200, 110)">
    <rect x="0" y="30" width="110" height="150" rx="8" fill="#0d0b1a" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="15" y="45" width="80" height="100" fill="#150f2b"/>
    <polygon points="25,125 55,85 85,125" fill="#38bdf8"/>
    <circle cx="45" cy="75" r="10" fill="#c084fc"/>

    <rect x="140" y="0" width="140" height="190" rx="10" fill="#0d0b1a" stroke="#a855f7" stroke-width="3"/>
    <rect x="155" y="15" width="110" height="140" fill="#1e1338"/>
    <circle cx="210" cy="85" r="35" fill="none" stroke="#c084fc" stroke-width="3"/>
    <polygon points="210,60 235,105 185,105" fill="#a855f7"/>

    <rect x="310" y="30" width="110" height="150" rx="8" fill="#0d0b1a" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="325" y="45" width="80" height="100" fill="#150f2b"/>
    <circle cx="365" cy="95" r="25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
