<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="actBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="50%" stop-color="#180e28"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#actBg6)"/>
  
  <!-- Certificate & Skills Masterclass Graphic -->
  <g transform="translate(320, 100)">
    <!-- Certificate Sheet -->
    <rect x="0" y="0" width="180" height="130" rx="10" fill="#0d0b1a" stroke="#c084fc" stroke-width="2"/>
    <rect x="12" y="12" width="156" height="106" rx="6" fill="#140f28" stroke="#231a44"/>
    <line x1="30" y1="35" x2="150" y2="35" stroke="#38bdf8" stroke-width="2"/>
    <line x1="45" y1="55" x2="135" y2="55" stroke="#a855f7" stroke-width="2"/>
    <line x1="55" y1="70" x2="125" y2="70" stroke="#7e22ce" stroke-width="1.5"/>
    <!-- Gold/Purple Ribbon Seal -->
    <circle cx="90" cy="95" r="14" fill="#a855f7"/>
    <polygon points="85,105 80,120 90,115 100,120 95,105" fill="#c084fc"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="200" height="36" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#a855f7" stroke-width="1"/>
  <text x="55" y="64" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">CERTIFICATE & CLASS</text>
  <rect x="40" y="88" width="310" height="42" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="115" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">COLOR GRADING MASTER</text>
</svg>
