<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="actBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060712"/>
      <stop offset="50%" stop-color="#111530"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#actBg5)"/>
  
  <!-- Camera & Community Media Camp Graphic -->
  <g transform="translate(340, 110)">
    <!-- Video Camera Base -->
    <rect x="0" y="30" width="120" height="80" rx="10" fill="#0d0b1a" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="60" cy="70" r="24" fill="#140f28" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="70" r="10" fill="#c084fc"/>
    <polygon points="120,45 160,25 160,95 120,75" fill="#0ea5e9"/>
    <!-- Heart / Volunteer Icon -->
    <path d="M 60 10 C 50 -10, 20 0, 60 30 C 100 0, 70 -10, 60 10 Z" fill="#a855f7"/>
  </g>

  <!-- Badges -->
  <rect x="40" y="40" width="190" height="36" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#0ea5e9" stroke-width="1"/>
  <text x="55" y="64" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="1">COMMUNITY & CAMP</text>
  <rect x="40" y="88" width="310" height="42" rx="8" fill="rgba(6, 7, 18, 0.9)" stroke="#a855f7" stroke-width="1"/>
  <text x="55" y="115" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">MEDIA VOLUNTEER CAMP</text>
</svg>
